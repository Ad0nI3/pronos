<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Suivi des bus Tango en temps réel</title>
    <!-- Inclure Leaflet CSS et JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-family: sans-serif;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <strong>Bus en temps réel</strong><br>
        Dernière mise à jour : <span id="timestamp">-</span>
    </div>

    <script>
        // 1. Initialiser la carte centrée sur Nîmes
        const map = L.map('map').setView([43.836, 4.360], 13);
        
        // 2. Ajouter un fond de carte (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        // 3. Objet pour stocker les marqueurs et pouvoir les mettre à jour
        const markers = new Map();
        
        // 4. Fonction pour récupérer et afficher les positions
        async function fetchAndDisplayBuses() {
            try {
                const response = await fetch('https://gtfs.bus-tracker.fr/gtfs-rt/tango/vehicle-positions?format=json');
                const data = await response.json();
                
                // Mettre à jour l'horodatage
                const timestamp = new Date(data.header.timestamp * 1000);
                document.getElementById('timestamp').textContent = timestamp.toLocaleTimeString();
                
                // Parcourir tous les véhicules
                data.entity.forEach(entity => {
                    const vehicle = entity.vehicle;
                    const position = vehicle.position;
                    const routeId = vehicle.trip.routeId;
                    const vehicleId = vehicle.vehicle.id;
                    const status = vehicle.currentStatus === 'STOPPED_AT' ? '🚏 À l\'arrêt' : '🚌 En route';
                    
                    // Créer les coordonnées
                    const lat = position.latitude;
                    const lng = position.longitude;
                    
                    // Créer le texte du popup
                    const popupText = `
                        <b>Ligne ${routeId}</b><br>
                        Bus n°${vehicleId}<br>
                        ${status}<br>
                        Vitesse: ${position.speed || 0} km/h<br>
                        Cap: ${position.bearing || 'N/A'}°
                    `;
                    
                    // Vérifier si le marqueur existe déjà
                    if (markers.has(vehicleId)) {
                        // Mettre à jour la position et le popup
                        const marker = markers.get(vehicleId);
                        marker.setLatLng([lat, lng]);
                        marker.bindPopup(popupText);
                    } else {
                        // Créer un nouveau marqueur
                        // Couleur différente selon la ligne (optionnel)
                        const icon = L.divIcon({
                            html: `<div style="background-color: #0078ff; border-radius: 50%; width: 12px; height: 12px; border: 2px solid white;"></div>`,
                            iconSize: [16, 16],
                            className: 'bus-marker'
                        });
                        
                        const marker = L.marker([lat, lng], { icon: icon })
                            .bindPopup(popupText)
                            .addTo(map);
                        
                        markers.set(vehicleId, marker);
                    }
                });
                
                // Optionnel : supprimer les marqueurs des bus qui ne sont plus dans les données
                const currentVehicleIds = new Set(data.entity.map(e => e.vehicle.vehicle.id));
                for (let [id, marker] of markers) {
                    if (!currentVehicleIds.has(id)) {
                        map.removeLayer(marker);
                        markers.delete(id);
                    }
                }
                
            } catch (error) {
                console.error('Erreur lors de la récupération des données:', error);
            }
        }
        
        // 5. Lancer la première récupération
        fetchAndDisplayBuses();
        
        // 6. Mettre à jour toutes les 10 secondes
        setInterval(fetchAndDisplayBuses, 10000);
    </script>
</body>
</html>
